<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
body{background:transparent;overflow:hidden}
#app{display:flex;height:540px}

/* Roster */
#roster{width:132px;flex-shrink:0;overflow-y:auto;padding:4px 6px 4px 4px;background:#f8fafc;border-right:1.5px solid #e2e8f0}
.role-hdr{color:#fff;padding:2px 7px;border-radius:4px;font-size:.63em;font-weight:700;letter-spacing:.3px;margin:6px 0 3px}
.role-hdr:first-child{margin-top:2px}
.emp-chip{display:flex;align-items:center;gap:5px;background:#fff;border:1.5px solid #e2e8f0;border-radius:5px;
  padding:5px 7px;margin-bottom:3px;cursor:grab;font-size:.74em;font-weight:600;color:#1e293b;
  user-select:none;transition:box-shadow .12s,transform .1s,border-color .12s}
.emp-chip:hover{box-shadow:0 2px 7px rgba(0,0,0,.1);transform:translateY(-1px);border-color:#94a3b8}
.emp-chip.dragging{opacity:.35;transform:scale(.95);box-shadow:none}
.emp-chip.locked{opacity:.5;cursor:not-allowed;background:#fff1f2;border-color:#fca5a5;color:#991b1b}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;border:1.5px solid rgba(0,0,0,.1)}

/* Timeline */
#timeline{flex:1;display:flex;flex-direction:column;min-width:0;padding:4px 6px 4px 0;overflow:hidden}
#time-axis{position:relative;height:22px;margin-left:122px;border-bottom:2px solid #e5e7eb;margin-bottom:3px;flex-shrink:0}
#rows-wrap{flex:1;overflow-y:auto;overflow-x:hidden}

.role-row-hdr{display:flex;align-items:center;margin:7px 0 2px}
.role-badge{font-size:.63em;font-weight:700;letter-spacing:.3px;padding:2px 7px;border-radius:4px;color:#fff;width:116px;flex-shrink:0}
.role-line{flex:1;height:1px;background:#e5e7eb;margin-left:6px}

.emp-row{display:flex;align-items:stretch;min-height:40px;margin-bottom:2px;border-radius:4px;border:1px solid #f1f5f9;transition:border-color .1s,background .1s}
.emp-row.drag-over{border-color:#f59e0b !important;background:rgba(245,158,11,.06) !important}
.row-label{width:116px;flex-shrink:0;padding:4px 8px;font-size:.77em;font-weight:600;color:#374151;display:flex;align-items:center;border-right:1px solid #e5e7eb;line-height:1.3}
.row-grid{flex:1;position:relative;cursor:crosshair}

.gridline{position:absolute;top:0;bottom:0;border-left:1px solid;pointer-events:none}
.shift-blk{position:absolute;top:5px;bottom:5px;border-radius:4px;color:#fff;font-size:.69em;font-weight:600;
  padding:2px 5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
  border-left:3px solid rgba(0,0,0,.2);cursor:grab;user-select:none;
  transition:opacity .1s,transform .1s;z-index:2}
.shift-blk:hover{opacity:.85;transform:translateY(-1px)}
.shift-blk.dragging{opacity:.25;transform:scale(.97)}
.now-wrap{position:absolute;top:0;bottom:0;pointer-events:none;z-index:4}
.now-line{width:2px;height:100%;background:#ef4444;opacity:.75}
.now-lbl{position:absolute;top:-18px;left:50%;transform:translateX(-50%);background:#ef4444;color:#fff;
  font-size:.58em;font-weight:700;padding:1px 4px;border-radius:3px;white-space:nowrap}

#hint{text-align:center;font-size:.63em;color:#94a3b8;padding:4px 0 2px;flex-shrink:0}
</style>
</head>
<body>
<div id="app">
  <div id="roster"></div>
  <div id="timeline">
    <div id="time-axis"></div>
    <div id="rows-wrap"><div id="rows"></div></div>
    <div id="hint">Drag a name from the roster onto the schedule · Drag a shift block to move or reassign it</div>
  </div>
</div>
<script>
var TSTART=6,TEND=24,TSPAN=18;
var dragging=null,lastTs=0;
var ROLE_ORDER=["Manager","Supervisor","Host/Hostess","Bartender","Server","Cook","Busser","Expeditor"];

function send(val){
  if(val._ts&&val._ts===lastTs)return;
  if(val._ts)lastTs=val._ts;
  window.parent.postMessage({type:"streamlit:setComponentValue",value:val,dataType:"json"},"*");
}

window.parent.postMessage({type:"streamlit:componentReady",apiVersion:1},"*");
window.parent.postMessage({type:"streamlit:setFrameHeight",height:580},"*");

window.addEventListener("message",function(e){
  if(!e.data||e.data.type!=="streamlit:render")return;
  var a=e.data.args;
  TSTART=a.tstart||6; TEND=a.tend||24; TSPAN=TEND-TSTART;
  render(JSON.parse(a.employees_json),JSON.parse(a.shifts_json),!!a.is_today,a.now_hour||null);
});

function pct(h){return(h-TSTART)/TSPAN*100}
function hourFromX(el,cx){
  var r=el.getBoundingClientRect();
  var x=(cx-r.left)/r.width;
  var h=TSTART+x*TSPAN;
  return Math.max(TSTART,Math.min(TEND-0.25,Math.round(h*4)/4));
}
function fmtH(h){
  var hh=Math.floor(h),mm=Math.round((h-hh)*60);
  return(hh%12||12)+":"+(mm<10?"0"+mm:mm)+(hh<12?" AM":" PM");
}
function axisLbl(hh){
  if(hh===12)return"12pm"; if(hh===24)return"12am";
  return(hh%12||12)+(hh<12?"am":"pm");
}

function render(employees,shifts,isToday,nowHour){
  buildRoster(employees);
  buildTimeline(employees,shifts,isToday,nowHour);
}

function buildRoster(employees){
  var panel=document.getElementById("roster");
  panel.innerHTML="";
  var roles=[];
  employees.forEach(function(e){if(roles.indexOf(e.role)<0)roles.push(e.role);});
  roles.sort(function(a,b){
    var ai=ROLE_ORDER.indexOf(a),bi=ROLE_ORDER.indexOf(b);
    if(ai<0)ai=99; if(bi<0)bi=99; return ai-bi;
  });
  roles.forEach(function(role){
    var emps=employees.filter(function(e){return e.role===role;});
    if(!emps.length)return;
    var h=document.createElement("div");
    h.className="role-hdr"; h.style.background=emps[0].color; h.textContent=role;
    panel.appendChild(h);
    emps.sort(function(a,b){return a.name.localeCompare(b.name);}).forEach(function(emp){
      var chip=document.createElement("div");
      chip.className="emp-chip"+(emp.locked?" locked":"");
      chip.innerHTML='<div class="dot" style="background:'+emp.color+'"></div>'+emp.name;
      chip.title=emp.locked?"Missing/expired cert — cannot schedule":"Drag onto the schedule to add a shift";
      if(!emp.locked){
        chip.draggable=true;
        chip.addEventListener("dragstart",function(ev){
          dragging={type:"emp",id:emp.id,name:emp.name,color:emp.color};
          ev.dataTransfer.effectAllowed="copy";
          ev.dataTransfer.setData("text/plain","emp:"+emp.id);
          chip.classList.add("dragging");
        });
        chip.addEventListener("dragend",function(){chip.classList.remove("dragging");dragging=null;});
      }
      panel.appendChild(chip);
    });
  });
}

function buildTimeline(employees,shifts,isToday,nowHour){
  // Time axis
  var axis=document.getElementById("time-axis");
  axis.innerHTML="";
  for(var hh=TSTART;hh<=TEND;hh+=2){
    var d=document.createElement("div");
    d.style.cssText="position:absolute;left:"+pct(hh)+"%;transform:translateX(-50%);font-size:.62em;color:#6b7280;font-weight:500;white-space:nowrap";
    d.textContent=axisLbl(hh);
    axis.appendChild(d);
  }

  // Employee rows
  var wrap=document.getElementById("rows");
  wrap.innerHTML="";
  var sorted=employees.slice().sort(function(a,b){
    var ai=ROLE_ORDER.indexOf(a.role),bi=ROLE_ORDER.indexOf(b.role);
    if(ai<0)ai=99; if(bi<0)bi=99;
    if(ai!==bi)return ai-bi;
    return a.name.localeCompare(b.name);
  });
  var curRole=null,rowIdx=0;
  sorted.forEach(function(emp){
    if(emp.role!==curRole){
      curRole=emp.role;
      var rh=document.createElement("div");
      rh.className="role-row-hdr";
      rh.innerHTML='<div class="role-badge" style="background:'+emp.color+'">'+curRole+'</div><div class="role-line"></div>';
      wrap.appendChild(rh);
    }
    var empShifts=shifts.filter(function(s){return s.emp_id===emp.id;});
    var row=document.createElement("div");
    row.className="emp-row";
    row.style.background=rowIdx%2===0?"#f8fafc":"#ffffff";
    rowIdx++;

    var lbl=document.createElement("div");
    lbl.className="row-label";
    lbl.innerHTML=emp.name+(emp.locked?' <span style="color:#ef4444;font-size:.8em">🔒</span>':"");
    row.appendChild(lbl);

    var grid=document.createElement("div");
    grid.className="row-grid";

    // Gridlines
    for(var g=TSTART;g<=TEND;g++){
      var gl=document.createElement("div");
      gl.className="gridline";
      gl.style.left=pct(g)+"%";
      gl.style.borderLeftColor=(g-TSTART)%2===0?"#e5e7eb":"#f3f4f6";
      grid.appendChild(gl);
    }

    // Now indicator
    if(isToday&&nowHour!==null&&nowHour>=TSTART&&nowHour<=TEND){
      var nw=document.createElement("div");
      nw.className="now-wrap";
      nw.style.left=pct(nowHour)+"%";
      nw.innerHTML='<div class="now-lbl">'+fmtH(nowHour)+'</div><div class="now-line"></div>';
      grid.appendChild(nw);
    }

    // Shift blocks
    empShifts.forEach(function(s){
      var sh=s.start_hour,eh=s.end_hour;
      if(eh<=sh)eh=TEND;
      var l=Math.max(TSTART,sh),r=Math.min(TEND,eh);
      if(r<=l)return;
      var blk=document.createElement("div");
      blk.className="shift-blk";
      blk.style.left=pct(l)+"%";
      blk.style.width=((r-l)/TSPAN*100)+"%";
      blk.style.background=emp.color;
      blk.title=(s.label||"")+(s.venue?" · "+s.venue:"")+" — drag to move";
      blk.textContent=s.label||"";
      blk.draggable=true;
      blk.addEventListener("dragstart",function(ev){
        dragging={type:"shift",id:s.id,empId:emp.id,color:emp.color,
                  dur:s.end_hour-s.start_hour};
        ev.dataTransfer.effectAllowed="move";
        ev.dataTransfer.setData("text/plain","shift:"+s.id);
        blk.classList.add("dragging");
        ev.stopPropagation();
      });
      blk.addEventListener("dragend",function(){blk.classList.remove("dragging");dragging=null;});
      grid.appendChild(blk);
    });

    // Drop zone
    grid.addEventListener("dragover",function(ev){
      if(dragging){ev.preventDefault();ev.dataTransfer.dropEffect=dragging.type==="shift"?"move":"copy";row.classList.add("drag-over");}
    });
    grid.addEventListener("dragleave",function(ev){
      if(!grid.contains(ev.relatedTarget))row.classList.remove("drag-over");
    });
    grid.addEventListener("drop",function(ev){
      ev.preventDefault(); row.classList.remove("drag-over");
      if(!dragging)return;
      var dropHour=hourFromX(grid,ev.clientX);
      var ts=Date.now();
      if(dragging.type==="emp"){
        send({type:"add",empId:dragging.id,dropHour:dropHour,_ts:ts});
      } else if(dragging.type==="shift"){
        send({type:"move",shiftId:dragging.id,newEmpId:emp.id,dropHour:dropHour,
              dur:dragging.dur,_ts:ts});
      }
      dragging=null;
    });

    row.appendChild(grid);
    wrap.appendChild(row);
  });
}
</script>
</body>
</html>
