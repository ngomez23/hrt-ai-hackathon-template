<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
body{background:transparent;overflow:hidden}
#app{display:flex;gap:10px;height:520px;padding:4px 2px}

/* Roster */
#roster{width:150px;flex-shrink:0;overflow-y:auto;padding-right:2px}
.role-hdr{color:#fff;padding:3px 8px;border-radius:6px;font-size:.7em;font-weight:700;margin:8px 0 3px;letter-spacing:.3px}
.role-hdr:first-child{margin-top:0}
.emp-chip{
  background:#f8fafc;border:1.5px solid #dde3ed;border-radius:6px;
  padding:6px 9px;margin-bottom:4px;cursor:grab;font-size:.81em;
  font-weight:600;color:#0F2D52;user-select:none;
  display:flex;align-items:center;gap:6px;
  transition:box-shadow .15s,transform .1s,border-color .15s,background .15s
}
.emp-chip:hover{box-shadow:0 2px 8px rgba(0,0,0,.12);transform:translateY(-1px);border-color:#F5A623;background:#FFFBEB}
.emp-chip.dragging{opacity:.35;transform:scale(.94);box-shadow:none}
.emp-chip.locked{opacity:.5;cursor:not-allowed;background:#fff1f2;border-color:#fca5a5;color:#991b1b}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;border:1.5px solid rgba(0,0,0,.15)}

/* Calendar */
#cal{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:5px;min-width:0;overflow:hidden}
.day-col{display:flex;flex-direction:column;min-width:0}
.day-hdr{text-align:center;padding:5px 2px;border-radius:6px;font-size:.8em;font-weight:700;margin-bottom:5px;flex-shrink:0;line-height:1.3}
.day-hdr.today{background:#1E88E5;color:#fff}
.day-hdr.future{background:#EFF6FF;color:#1E40AF}
.day-hdr.past{background:#f3f4f6;color:#9ca3af}
.day-hdr span{display:block;font-size:.82em;font-weight:400}
.drop-zone{
  flex:1;border-radius:6px;padding:3px;min-height:50px;
  border:2px dashed transparent;
  transition:border-color .12s,background .12s
}
.drop-zone.over{border-color:#F5A623!important;background:rgba(245,166,35,.08)!important}
.shift-card{
  border-radius:5px;padding:5px 6px;margin-bottom:4px;
  font-size:.73em;font-weight:600;color:#fff;line-height:1.35;
  cursor:grab;user-select:none;
  transition:opacity .12s,transform .1s;position:relative
}
.shift-card:hover{opacity:.88;transform:translateY(-1px)}
.shift-card.dragging{opacity:.3;transform:scale(.93)}
.s-time{font-weight:400;opacity:.9;font-size:.92em}
.s-venue{font-size:.85em;opacity:.8;font-style:italic}

/* Hint */
#hint{text-align:center;color:#94a3b8;font-size:.68em;margin-top:5px;flex-shrink:0}
</style>
</head>
<body>
<div id="app">
  <div id="roster"></div>
  <div id="cal"></div>
</div>
<div id="hint">Drag a name onto a day to schedule &nbsp;·&nbsp; Drag a shift card to move it</div>

<script>
var dragging = null;

function send(val){
  window.parent.postMessage({type:"streamlit:setComponentValue",value:val,dataType:"json"},"*");
}

window.parent.postMessage({type:"streamlit:componentReady",apiVersion:1},"*");
window.parent.postMessage({type:"streamlit:setFrameHeight",height:560},"*");

window.addEventListener("message",function(e){
  if(!e.data||e.data.type!=="streamlit:render")return;
  var a=e.data.args;
  render(JSON.parse(a.employees),JSON.parse(a.shifts),JSON.parse(a.days));
});

function render(employees,shifts,days){
  buildRoster(employees);
  buildCal(employees,shifts,days);
}

function buildRoster(employees){
  var panel=document.getElementById("roster");
  panel.innerHTML="";
  var roles=[];
  employees.forEach(function(e){if(roles.indexOf(e.role)<0)roles.push(e.role);});
  roles.forEach(function(role){
    var emps=employees.filter(function(e){return e.role===role;});
    if(!emps.length)return;
    var h=document.createElement("div");
    h.className="role-hdr";h.style.background=emps[0].color;h.textContent=role;
    panel.appendChild(h);
    emps.sort(function(a,b){return a.name.localeCompare(b.name);}).forEach(function(emp){
      var chip=document.createElement("div");
      chip.className="emp-chip"+(emp.locked?" locked":"");
      chip.innerHTML='<div class="dot" style="background:'+emp.color+'"></div>'
        +(emp.locked?"🔒 ":"")+emp.name;
      chip.title=emp.locked?"Missing/expired certification — cannot schedule":"Drag to a day to schedule";
      if(!emp.locked){
        chip.draggable=true;
        chip.addEventListener("dragstart",function(ev){
          dragging={type:"emp",id:emp.id};
          ev.dataTransfer.effectAllowed="copy";
          ev.dataTransfer.setData("text/plain","emp:"+emp.id);
          chip.classList.add("dragging");
        });
        chip.addEventListener("dragend",function(){chip.classList.remove("dragging");dragging=null;});
      }
      panel.appendChild(chip);
    });
  });
}

function buildCal(employees,shifts,days){
  var cal=document.getElementById("cal");
  cal.innerHTML="";
  days.forEach(function(day){
    var col=document.createElement("div");col.className="day-col";
    var hdr=document.createElement("div");
    hdr.className="day-hdr "+(day.is_today?"today":day.is_past?"past":"future");
    hdr.innerHTML="<b>"+day.label+"</b><span>"+day.date+"</span>";
    col.appendChild(hdr);
    var zone=document.createElement("div");zone.className="drop-zone";
    zone.dataset.dayOffset=day.offset;
    // Shift cards
    shifts.filter(function(s){return s.day_offset===day.offset;}).forEach(function(s){
      var card=document.createElement("div");
      card.className="shift-card";card.style.background=s.color;
      card.dataset.shiftId=s.shift_id;
      card.innerHTML=s.emp_name+'<br><span class="s-time">'+s.start+"–"+s.end+"</span>"
        +(s.venue?'<br><span class="s-venue">'+s.venue+"</span>":"");
      if(!day.is_past){
        card.draggable=true;
        card.addEventListener("dragstart",function(ev){
          dragging={type:"shift",id:s.shift_id};
          ev.dataTransfer.effectAllowed="move";
          ev.dataTransfer.setData("text/plain","shift:"+s.shift_id);
          card.classList.add("dragging");
        });
        card.addEventListener("dragend",function(){card.classList.remove("dragging");dragging=null;});
      }
      zone.appendChild(card);
    });
    // Drop events — only future/today
    if(!day.is_past){
      zone.addEventListener("dragover",function(ev){
        ev.preventDefault();
        ev.dataTransfer.dropEffect=dragging&&dragging.type==="shift"?"move":"copy";
        zone.classList.add("over");
      });
      zone.addEventListener("dragleave",function(ev){
        if(!zone.contains(ev.relatedTarget))zone.classList.remove("over");
      });
      zone.addEventListener("drop",function(ev){
        ev.preventDefault();zone.classList.remove("over");
        if(!dragging)return;
        var offset=parseInt(zone.dataset.dayOffset);
        if(dragging.type==="emp"){
          send({type:"drop",empId:dragging.id,dayOffset:offset,_ts:Date.now()});
        } else if(dragging.type==="shift"){
          if(offset!==day.offset){
            send({type:"move",shiftId:dragging.id,dayOffset:offset,_ts:Date.now()});
          }
        }
        dragging=null;
      });
    }
    col.appendChild(zone);cal.appendChild(col);
  });
}
</script>
</body></html>
